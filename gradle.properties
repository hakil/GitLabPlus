# 版本号单一来源：jar 名、zip 名、plugin.xml 的 <version> 均由此决定
pluginVersion=0.2.0

# 目标平台（IntelliJ Platform）
# local() 模式：指向本机 IDEA 安装目录，零下载，编译与运行时同一 build
# 可用 -PplatformLocalPath=... 或 ~/.gradle/gradle.properties 覆盖
platformLocalPath=D:/IDEA/2026.2
sinceBuild=262
javaVersion=25

# 调试与性能
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
